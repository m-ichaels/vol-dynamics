[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "voldyn"
version = "0.1.0"
description = "Volatility dynamics research and systematic volatility strategies"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "pyarrow", "scipy", "duckdb", "matplotlib", "fpdf2"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["voldyn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
